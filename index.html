<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b1e">
<title>HEALTHY QUEST</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0e1116;color:#fff;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fade{position:fixed;inset:0;background:#05060f;opacity:1;pointer-events:none;transition:opacity .34s;z-index:5}
#flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:6}
#vrline{position:fixed;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.28);z-index:7;display:none;pointer-events:none}
body.playing[data-mode=vr] #vrline{display:block}
#chrome{position:fixed;top:8px;right:8px;z-index:8;display:none;gap:6px}
body.playing #chrome{display:flex}
body.playing[data-mode=vr] #chrome{right:auto;left:50%;transform:translateX(-50%);opacity:.5}
body.playing[data-mode=vr] #x-full,body.playing[data-mode=vr] #x-mute{display:none}
#chrome button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(13,22,48,.7);color:#fff;font-size:17px;cursor:pointer}
#rotate{position:fixed;inset:0;z-index:9;background:#070b1e;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;line-height:1.8;padding:24px}
@media (orientation:portrait){body.playing[data-mode=vr] #rotate{display:flex}}
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;overflow:auto;background:linear-gradient(180deg,rgba(8,10,14,.55) 0%,rgba(8,10,14,0) 34%,rgba(8,10,14,0) 46%,rgba(8,10,14,.82) 100%)}
body.playing #title{display:none}
.hero{padding:max(26px,env(safe-area-inset-top)) clamp(18px,5vw,64px) 0}
.over2{display:block;margin-top:.55em;color:#e8743b;letter-spacing:.2em}
.over{margin:0;font-size:clamp(10.5px,1.5vw,13px);font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.82)}
h1{margin:8px 0 6px;font-size:clamp(34px,8.4vw,92px);line-height:1;font-weight:800;letter-spacing:.035em;color:#fff;white-space:nowrap;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.lead{margin:0;font-size:clamp(12px,2.2vw,19px);font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap}
.panel{padding:0 clamp(18px,5vw,64px) max(20px,env(safe-area-inset-bottom))}
.panel h2{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.12em;color:#fff}
.panel h2 span{margin-left:10px;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.7)}
.areas{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:760px){.areas{grid-template-columns:repeat(3,1fr)}}
.areas button{appearance:none;text-align:left;font:inherit;color:#fff;background:rgba(14,17,22,.62);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:10px 11px 11px;cursor:pointer;transition:background .15s,border-color .15s}
.areas button i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;color:rgba(255,255,255,.6)}
.areas button b{display:block;margin-top:3px;font-size:clamp(12px,1.55vw,16px);font-weight:700;white-space:nowrap}
.areas button small{display:block;margin-top:2px;font-size:11px;color:rgba(255,255,255,.72);white-space:nowrap}
.areas button.on{background:#e8743b;border-color:#e8743b}
.areas button.on i,.areas button.on small{color:rgba(255,255,255,.95)}
.go{display:flex;gap:10px;margin:14px 0 12px}
.go button{appearance:none;font:inherit;font-size:16px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:15px 26px;cursor:pointer}
.go .pri{flex:1.4;max-width:380px;background:#fff;color:#0e1116;border:1px solid #fff}
.go .sec{flex:1;max-width:260px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7)}
.foot{margin:0;font-size:12.5px;color:rgba(255,255,255,.75)}
.foot a{margin-right:18px;color:#fff;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn{appearance:none;border:0;border-radius:4px;padding:11px 16px;font:inherit;font-size:14.5px;font-weight:700;color:#fff;background:#e8743b;cursor:pointer}
.btn.sub{background:#5a6480}
#modal{position:fixed;inset:0;z-index:20;background:rgba(3,6,18,.72);display:none;align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.sheet{width:min(760px,100%);max-height:92%;display:flex;flex-direction:column;background:#fff;color:#17233f;border-radius:6px;overflow:hidden;-webkit-user-select:text;user-select:text}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#0e1116;color:#fff}
.sheet header h2{margin:0;font-size:17px}
.sheet header button{appearance:none;border:0;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer}
#mbody{padding:14px 18px 20px;overflow:auto;font-size:14.5px;line-height:1.7}
#mbody h3{margin:18px 0 6px;font-size:15px;color:#0e1116}
#mbody table{width:100%;border-collapse:collapse;font-size:13px}
#mbody th,#mbody td{border:1px solid #dbe3f3;padding:5px 7px;text-align:left;vertical-align:top}
#mbody th{background:#eef3ff;white-space:nowrap}
#mbody td.fact{font-size:12px;color:#3a4766}
.hpbox{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#fff3f8,#eef6ff);border-radius:14px;padding:12px 16px}
.hpnum{font-size:44px;font-weight:900;color:#ff5f86;line-height:1}.hpnum small{font-size:16px;color:#8a93ad}
.steps li{margin-bottom:10px}
.note{background:#fff8d9;border:1px solid #ffd76a;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.small{font-size:12.5px;color:#5a6480}
.chk{display:block;margin:10px 0;font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}

fieldset{border:1px solid #c5d2ee;border-radius:12px;margin:10px 0;padding:8px 12px 12px}
legend{font-weight:900;color:#2a3f7a;padding:0 6px}.ans{font-weight:700;font-size:12.5px;color:#18875a;margin-left:8px}
#mbody label{display:block;font-size:12.5px;font-weight:700;margin-top:6px}
#mbody input:not([type=checkbox]):not([type=radio]),#mbody textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:16px;border:1px solid #c5d2ee;border-radius:9px;background:#f8faff;color:#17233f}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.grid3{grid-template-columns:1fr}}
.out{background:#f1fffb;border:1px solid #9be3cc;border-radius:12px;padding:8px 12px;margin-top:8px;word-break:break-all}
#tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(30px);z-index:30;max-width:min(560px,92%);background:#17233f;color:#fff;border:1px solid #ffd34d;border-radius:14px;padding:10px 16px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s}
#tip.on{opacity:1;transform:translateX(-50%)}
.setup{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 12px;text-align:left}
@media (max-width:520px){.setup{grid-template-columns:1fr}}
.setup label{font-size:12px;font-weight:800;color:#cfe0ff}
.setup input{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:16px;font-weight:800;-webkit-user-select:text;user-select:text}
.setup input::placeholder{color:rgba(255,255,255,.55)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.mode button{appearance:none;font:inherit;font-weight:900;font-size:15px;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.28);border-radius:12px;padding:8px 6px;cursor:pointer}
.mode button small{display:block;font-size:11px;font-weight:700;opacity:.8}
.mode button.on{background:linear-gradient(180deg,#ff8fb8,#ff5f8f);border-color:#fff}
h2.rk{margin:16px 0 6px;font-size:15px;color:#ffe066;text-align:left}
#rank{list-style:none;margin:0 0 12px;padding:0;max-height:168px;overflow:auto;background:rgba(0,0,0,.25);border-radius:12px;text-align:left}
#rank li{display:grid;grid-template-columns:34px 1fr 52px 78px;gap:6px;padding:6px 12px;font-size:14px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.08)}
#rank li:first-child{color:#ffe066}
#rank .no{opacity:.8}#rank .ac{opacity:.7;text-align:right;font-size:12.5px}#rank .sc{text-align:right}
#rank li.empty{display:block;font-weight:700;color:#cfe0ff;font-size:13px}
#progress{display:none}


.setup input:focus{outline:2px solid #ffe066;background:rgba(255,255,255,.2)}


.areas{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.areas button{appearance:none;font:inherit;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:7px 2px;cursor:pointer;font-size:clamp(15px,4.4vw,22px);line-height:1.15}
.areas button b{display:block;font-size:clamp(8.5px,2.5vw,13px);font-weight:900;white-space:nowrap}
.areas button small{display:block;font-size:clamp(7px,2vw,10.5px);opacity:.8;white-space:nowrap}
.areas button.on{background:linear-gradient(180deg,#ff8fb8,#ff5f8f);border-color:#fff}

</style>
</head>
<body data-mode="mono">
<canvas id="gl"></canvas>
<div id="fade"></div><div id="flash"></div><div id="vrline"></div>
<div id="chrome"><button id="x-mute" aria-label="音">🔊</button><button id="x-full" aria-label="全画面">⛶</button><button id="x-exit" aria-label="おわる">✕</button></div>
<div id="rotate">📱↻<br>スマホを横向きにして<br>ゴーグルに入れてね</div>
<main id="title">
  <section class="hero">
    <p class="over">STEAMチャレンジ　からだと健康の科学<span class="over2">保健 × 情報　教科横断</span></p>
    <h1>HEALTHY QUEST</h1>
    <p class="lead">6つの乗りもので世界の絶景をめぐり、からだと健康の科学に挑む。</p>
  </section>
  <section class="panel">
    <h2>コースを選ぶ <span id="picked"></span></h2>
    <div class="areas">
      <button data-a="brain"><i>01　犬ぞり</i><b>星空の雪山</b><small>脳・睡眠</small></button>
      <button data-a="lung"><i>02　ハンググライダー</i><b>朝霧の森と湖</b><small>肺・呼吸</small></button>
      <button data-a="heart"><i>03　トロッコ</i><b>夕焼けの大峡谷</b><small>心臓・運動</small></button>
      <button data-a="gut"><i>04　熱気球</i><b>実りの谷</b><small>胃腸・栄養</small></button>
      <button data-a="bone"><i>05　ヘリコプター</i><b>氷河の入り江</b><small>骨・姿勢</small></button>
      <button data-a="skin"><i>06　イルカ</i><b>南の島の海</b><small>皮膚・紫外線</small></button>
    </div>
    <div class="go">
      <button class="pri" id="b-vr">VRゴーグルで出発</button>
      <button class="sec" id="b-mono">画面で出発</button>
    </div>
    <p class="foot"><a id="b-how">あそびかた</a><a id="b-teacher">先生用設定</a><span>VRは着席で1回8分まで</span></p>
  </section>
</main>
<div id="modal"><div class="sheet"><header><h2 id="mtitle"></h2><button id="mclose" aria-label="とじる">✕</button></header><div id="mbody"></div></div></div>
<div id="tip"></div>

  }

  /* ---------- 体験者（スマホ）側：画面を配信 ---------- */
  const host={peer:null,code:null,stream:null,viewers:new Map(),state:"off",retry:null};
  function badge(){
    const b=$("spec-badge"),n=host.viewers.size;
    b.classList.toggle("on",host.state!=="off");
    b.classList.toggle("live",n>0);
    b.querySelector("span").textContent=n>0?`観戦中 ${n}人`:`観戦コード ${host.code||"----"}`;
    const st=$("spec-st");
    if(st)st.textContent=host.state==="ready"?(n>0?`${n}人が観戦中です`:"PCからの接続を待っています…"):host.state==="connecting"?"準備中…":host.state==="error"?"接続できませんでした。ネットワークを確認してください":"";
  }
  function newCode(){return String(Math.floor(1000+Math.random()*9000))}

  /* 観戦用の映像：VRのときは横長の1画面を別に描き、画面モードのときはそのまま縮小コピー */
  const out={cv:document.createElement("canvas"),last:0};
  out.cv.width=960;out.cv.height=540;
  out.cv.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px;pointer-events:none";
  document.body.appendChild(out.cv);
  out.g=out.cv.getContext("2d");
  const FPS_VR=20,ASPECT=16/9;
  window.__hqSpecPre=(R,scene,cam,m)=>{
    if(m!=="vr"||!host.viewers.size)return;
    const now=performance.now();if(now-out.last<1000/FPS_VR)return;out.last=now;
    const gl=R.domElement,pr=R.getPixelRatio(),W=window.innerWidth,H=window.innerHeight;
    const cw=Math.floor(Math.min(W,H*ASPECT,640)),ch=Math.floor(cw/ASPECT);
    const a=cam.aspect,f=cam.fov;
    R.setScissorTest(false);R.setViewport(0,0,cw,ch);R.clear();
    cam.aspect=ASPECT;cam.fov=72;cam.updateProjectionMatrix();
    R.render(scene,cam);
    cam.aspect=a;cam.fov=f;cam.updateProjectionMatrix();
    const sw=Math.floor(cw*pr),sh=Math.floor(ch*pr);
    if(out.cv.width!==sw||out.cv.height!==sh){out.cv.width=sw;out.cv.height=sh}
    out.g.drawImage(gl,0,gl.height-sh,sw,sh,0,0,sw,sh);
  };
  window.__hqSpecPost=m=>{
    if(m==="vr"||!host.viewers.size)return;
    const gl=$("gl"),k=Math.min(1,960/gl.width),w=Math.round(gl.width*k),h=Math.round(gl.height*k);
    if(out.cv.width!==w||out.cv.height!==h){out.cv.width=w;out.cv.height=h}
    out.g.drawImage(gl,0,0,w,h);
  };
  async function hostStart(){
    if(host.state==="ready"||host.state==="connecting")return;
    host.state="connecting";host.code=host.code||store.get("hq-spec-code")||newCode();badge();
    try{await loadLib()}catch{host.state="error";badge();return}
    if(!host.stream){
      const cap=out.cv.captureStream||out.cv.mozCaptureStream;
      if(!cap){host.state="error";badge();alert("このブラウザは画面の配信に対応していません");return}
      host.stream=cap.call(out.cv,30);
    }
    const peer=new Peer(PREFIX+host.code,OPTS);host.peer=peer;
    peer.on("open",()=>{host.state="ready";store.set("hq-spec-code",host.code);store.set("hq-spec-on","1");badge()});
    peer.on("connection",conn=>{
      conn.on("open",()=>{
        const call=peer.call(conn.peer,host.stream);
        host.viewers.set(conn.peer,{conn,call});
        badge();
      });
      const drop=()=>{const v=host.viewers.get(conn.peer);if(v){try{v.call&&v.call.close()}catch{}host.viewers.delete(conn.peer);badge()}};
      conn.on("close",drop);conn.on("error",drop);
    });
    peer.on("disconnected",()=>{if(host.state==="ready"){try{peer.reconnect()}catch{}}});
    peer.on("error",e=>{
      if(e.type==="unavailable-id"){peer.destroy();host.peer=null;host.code=newCode();host.state="off";hostStart();return}
      if(["network","server-error","socket-error","socket-closed"].includes(e.type)){
        peer.destroy();host.peer=null;host.state="error";badge();
        clearTimeout(host.retry);host.retry=setTimeout(()=>{if(host.state==="error"){host.state="off";hostStart()}},5000);
      }
    });
  }
  function hostStop(){
    clearTimeout(host.retry);store.set("hq-spec-on",null);
    for(const v of host.viewers.values()){try{v.call&&v.call.close();v.conn.close()}catch{}}
    host.viewers.clear();
    if(host.peer){host.peer.destroy();host.peer=null}
    if(host.stream){host.stream.getTracks().forEach(t=>t.stop());host.stream=null}
    host.state="off";badge();
  }

  function openHostSheet(){
    $("mtitle").textContent="観戦をうけつける（体験者のスマホ）";
    $("mbody").innerHTML=`
      <p>この画面を、先生や友だちがパソコンで見られるようにします。</p>
      <div class="spec-code" id="spec-codebox">${host.code||store.get("hq-spec-code")||"----"}</div>
      <div class="spec-st" id="spec-st"></div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="spec-on">${host.state==="off"||host.state==="error"?"観戦をうけつける":"うけつけ中（とめる）"}</button>
      </div>
      <h3>パソコンでの見かた</h3>
      <ol class="steps"><li>パソコンでこのアプリを開き、タイトル画面の「観戦モード（PC）」をクリック</li><li>上の4けたの観戦コードを入れる</li></ol>
      <div class="note">・スマホとパソコンがインターネットにつながっている必要があります（同じWi-Fiだとつながりやすい）<br>・VRゴーグルモードのときも、観戦する側には横長の普通の画面で表示されます<br>・観戦コードはこの端末で固定です。ゲームを始めても配信はつづきます</div>`;
    $("modal").classList.add("on");$("mbody").scrollTop=0;
    $("spec-on").onclick=async()=>{
      if(host.state==="off"||host.state==="error"){await hostStart()}else hostStop();
      openHostSheet();
    };
    badge();
  }
  // 状態の変化に合わせてシートの表示を更新
  const _badge=badge;badge=function(){_badge();const box=$("spec-codebox"),on=$("spec-on");if(box)box.textContent=host.code||"----";if(on)on.textContent=host.state==="off"||host.state==="error"?"観戦をうけつける":"うけつけ中（とめる）"};

  /* ---------- 観戦側（PC）：受信して表示 ---------- */
  const view={peer:null,video:null,raf:0,conn:null};
  function vmsg(s){$("spec-msg").textContent=s}
  function viewOpen(){$("spec-view").classList.add("on");$("spec-join").style.display="flex";setTimeout(()=>$("spec-code").focus(),50)}
  function viewClose(){
    cancelAnimationFrame(view.raf);
    if(view.peer){view.peer.destroy();view.peer=null}
    if(view.video){view.video.srcObject=null;view.video=null}
    $("spec-view").classList.remove("on");
    try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
    const u=new URL(location.href);if(u.searchParams.has("watch")){u.searchParams.delete("watch");history.replaceState(null,"",u)}
  }
  function draw(){
    view.raf=requestAnimationFrame(draw);
    const v=view.video,cv=$("spec-cv");if(!v||!v.videoWidth)return;
    const dpr=window.devicePixelRatio||1,W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    const sw=v.videoWidth,sh=v.videoHeight;
    const k=Math.min(W/sw,H/sh),dw=sw*k,dh=sh*k;
    const g=cv.getContext("2d");g.fillStyle="#05060f";g.fillRect(0,0,W,H);
    g.drawImage(v,0,0,sw,sh,(W-dw)/2,(H-dh)/2,dw,dh);
  }
  async function viewConnect(code){
    if(!/^\d{4}$/.test(code)){vmsg("4けたの数字を入れてください");return}
    vmsg("接続中…");
    try{await loadLib()}catch{vmsg("通信ライブラリを読みこめませんでした。ネットワークを確認してください");return}
    if(view.peer)view.peer.destroy();
    const peer=new Peer(OPTS);view.peer=peer;
    let got=false;
    const to=setTimeout(()=>{if(!got)vmsg("つながりません。コードと、スマホで「うけつけ中」になっているか確認してください")},12000);
    peer.on("open",()=>{
      const conn=peer.connect(PREFIX+code,{reliable:true});view.conn=conn;
      conn.on("close",()=>{if(view.peer===peer){$("spec-join").style.display="flex";vmsg("体験者との接続が切れました")}});
    });
    peer.on("call",call=>{
      call.answer();
      call.on("stream",stream=>{
        got=true;clearTimeout(to);
        const v=document.createElement("video");v.muted=true;v.playsInline=true;v.autoplay=true;v.srcObject=stream;
        v.play().catch(()=>{});view.video=v;
        $("spec-join").style.display="none";$("spec-info").textContent=`観戦コード ${code} を観戦中`;
        cancelAnimationFrame(view.raf);draw();
      });
    });
    peer.on("error",e=>{clearTimeout(to);vmsg(e.type==="peer-unavailable"?"そのコードの体験者が見つかりません。スマホで「観戦をうけつける」をおしてください":"接続エラー："+e.type)});
  }
  $("spec-go").onclick=()=>viewConnect($("spec-code").value.trim());
  $("spec-code").addEventListener("keydown",e=>{if(e.key==="Enter")viewConnect(e.target.value.trim())});
  $("spec-close").onclick=viewClose;
  $("spec-full").onclick=()=>{const el=$("spec-view");try{document.fullscreenElement?document.exitFullscreen():(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch{}};

  /* ---------- タイトル画面にリンクを追加 ---------- */
  const foot=document.querySelector("#title .foot");
  const a1=document.createElement("a");a1.textContent="観戦をうけつける";a1.onclick=openHostSheet;
  const a2=document.createElement("a");a2.textContent="観戦モード（PC）";a2.onclick=viewOpen;
  foot.insertBefore(a2,foot.querySelector("span"));foot.insertBefore(a1,a2);

  // URLに ?watch=1234 があればそのまま観戦
  const q=new URLSearchParams(location.search);
  if(q.has("watch")){viewOpen();const c=q.get("watch");if(/^\d{4}$/.test(c)){$("spec-code").value=c;viewConnect(c)}}
  // 前回うけつけ中だった端末は自動で再開
  else if(store.get("hq-spec-on")==="1"){host.code=store.get("hq-spec-code");hostStart()}
})();
</script>
</body>
</html>
